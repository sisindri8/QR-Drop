<!doctype html>
<html><head><meta charset="utf-8"><title>QR Drop — send to phone</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1216;color:#e5e7eb;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{width:100%;max-width:420px;background:#14181f;border-radius:18px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:20px;color:#d1fae5}.sub{color:#9ca3af;font-size:13px;margin:0 0 16px}
  #qr{background:#fff;border-radius:12px;padding:8px;width:230px;height:230px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#6b7280}
  #qr svg{width:100%;height:100%}#qr.ok{background:#064e3b;color:#6ee7b7;font-size:64px}
  #status{min-height:20px;font-size:14px;color:#cbd5e1}#status.ok{color:#34d399}#status.err{color:#f87171}
  #drop{display:none;margin-top:14px;border:2px dashed #2b3340;border-radius:12px;padding:20px;cursor:pointer;color:#9ca3af}
  #drop.on{display:block}#drop.over{border-color:#10b981;color:#d1fae5}
  .barwrap{display:none;height:6px;background:#252b36;border-radius:4px;overflow:hidden;margin-top:12px}.barwrap.on{display:block}
  #bar{height:100%;width:0;background:#10b981}#info{font-size:12px;color:#9ca3af;margin-top:6px;min-height:16px;word-break:break-all}
  #got{margin-top:14px;text-align:left}#got a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;margin-top:6px;background:#1d2430;border-radius:8px;color:#34d399;text-decoration:none;font-size:13px;word-break:break-all}
</style></head><body>
<div class="card">
  <h1>Send files to your phone</h1>
  <p class="sub" id="sub">Scan with your phone camera</p>
  <div id="qr">Preparing…</div>
  <div id="status">Starting…</div>
  <div id="drop"><input id="picker" type="file" multiple hidden>Drop files here or click to choose</div>
  <div class="barwrap" id="bw"><div id="bar"></div></div><div id="info"></div>
  <div id="got"></div>
</div>
<script src="lib/config.js"></script><script src="lib/qrcode.min.js"></script><script src="lib/session.js"></script><script src="transfer.js"></script>
</body></html>
